name: Release

# Tags build a fully validated draft. Publishing remains a separate manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-release.mjs version "$GITHUB_REF_NAME"
      - run: node scripts/verify-release.mjs draft "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            platform: win32
            arch: x64
          - os: macos-latest
            script: build:mac
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            script: build:mac
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            script: build:linux
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture: ' + process.arch)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # All package scripts include typecheck. pnpm forwards these flags without an extra --.
      - run: pnpm run ${{ matrix.script }} --publish never
      - if: runner.os == 'macOS'
        run: node scripts/verify-macos-native-deps.mjs
      - run: node scripts/verify-packaged-app.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: node scripts/verify-release.mjs assets ${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*-mac.zip
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: node scripts/verify-release.mjs assets all
      # Recheck immediately before uploading, including on a manually rerun job.
      - run: node scripts/verify-release.mjs draft "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body_path: release-notes/${{ github.ref_name }}.md
          files: dist/*
